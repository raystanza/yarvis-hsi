name: Release

# Every run validates and packages the wallpaper. Only version-tag pushes
# publish a release; manual runs make a downloadable artifact.
on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax and Lively metadata
        run: |
          node --check app.js
          node -e "for (const file of ['LivelyInfo.json', 'LivelyProperties.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'));"

      # Use the same whitespace handling as build.ps1, which names the ZIP
      # from this file. A release tag must identify that exact version.
      - name: Check the package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath version -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "The version file must not be empty."
          }
          if ($env:GITHUB_REF.StartsWith('refs/tags/v') -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' does not match version '$version'. Update the version file before tagging a release."
          }

      # PowerShell 7 is available on GitHub's Ubuntu runners.
      - name: Build the wallpaper package
        shell: pwsh
        run: ./build.ps1

      - name: Upload the ZIP as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: YARVIS
          path: dist/YARVIS-v*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the validated package
        uses: actions/download-artifact@v8
        with:
          name: YARVIS
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/YARVIS-v*.zip --verify-tag --generate-notes
